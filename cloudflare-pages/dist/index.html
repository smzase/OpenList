<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>OpenList Pages</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8fa;
        color: #1f2937;
      }
      main {
        width: min(560px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid #d8dee8;
        border-radius: 8px;
        background: #fff;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.25;
      }
      p {
        margin: 8px 0;
        line-height: 1.6;
      }
      code {
        padding: 2px 5px;
        border-radius: 4px;
        background: #eef2f7;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111827;
          color: #e5e7eb;
        }
        main {
          background: #18212f;
          border-color: #334155;
        }
        code {
          background: #243244;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenList Pages</h1>
      <p>This Cloudflare Pages app is ready. Configure <code>OPENLIST_WEB_CDN</code> to serve the official OpenList frontend, or use the API directly.</p>
      <p>Health check: <a href="/ping">/ping</a></p>
    </main>
  </body>
</html>
